name: CI

on:
  push:
    branches: [securecatch-base, main]
  pull_request:
    branches: [securecatch-base, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: file:./dev.db
      SECURECATCH_SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
